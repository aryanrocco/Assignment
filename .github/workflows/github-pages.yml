name: GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/d3moon-consulting-website-b7f8
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p site/css site/js site/images
          cp docs/index.html docs/404.html docs/.nojekyll site/
          cp public/css/d3moon.css site/css/
          cp public/js/d3moon.js site/js/
          cp public/images/d3moon-mark.svg site/images/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
