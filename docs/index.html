<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Kolkata Date</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #12090c;
      --bg-soft: #1c1014;
      --ink: #f6eee4;
      --muted: rgba(246, 238, 228, 0.68);
      --gold: #e2c48a;
      --gold-2: #b8894a;
      --wine: #9a3040;
      --line: rgba(226, 196, 138, 0.22);
      --shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Manrope, system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    button, input, textarea {
      font: inherit;
      color: inherit;
    }
    .serif { font-family: "Cormorant Garamond", serif; }
    .wrap { width: min(1120px, calc(100% - 32px)); margin: 0 auto; }
    .nav {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 18px 0;
      background: linear-gradient(to bottom, rgba(18,9,12,.92), rgba(18,9,12,.64) 70%, transparent);
      backdrop-filter: blur(10px);
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .brand strong {
      font-family: "Cormorant Garamond", serif;
      font-size: 28px;
      font-weight: 600;
      font-style: italic;
      letter-spacing: 0.01em;
    }
    .brand span, .kicker {
      color: var(--gold);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-size: 10px;
    }
    .nav-links { display: flex; gap: 22px; font-size: 14px; color: var(--muted); }
    .nav-links a:hover { color: var(--gold); }
    .hero {
      position: relative;
      min-height: 78vh;
      margin: 8px 0 42px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .hero img {
      width: 100%;
      height: 78vh;
      object-fit: cover;
      filter: saturate(1.05) contrast(1.05);
    }
    .hero-shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(12,6,8,.78) 0%, rgba(12,6,8,.28) 52%, rgba(12,6,8,.18) 100%),
        linear-gradient(to top, rgba(12,6,8,.55), transparent 42%);
    }
    .hero-copy {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 48px 44px 42px;
      max-width: 720px;
    }
    .hero h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(48px, 8vw, 92px);
      line-height: 0.92;
      margin: 10px 0 16px;
      font-weight: 600;
    }
    .hero p { margin: 0; font-size: 18px; color: var(--muted); max-width: 46ch; }
    .steps {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      margin: 22px 0 0;
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    .tile {
      position: relative;
      min-height: 280px;
      border-radius: 22px;
      overflow: hidden;
      isolation: isolate;
      box-shadow: 0 16px 40px rgba(0,0,0,.28);
      transform: translateY(0);
      transition: transform .25s ease, box-shadow .25s ease;
    }
    .tile:hover { transform: translateY(-6px); box-shadow: var(--shadow); }
    .tile.wide { grid-column: span 2; min-height: 340px; }
    .tile img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
    .tile-shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(12,6,8,.88), rgba(12,6,8,.15) 55%);
    }
    .tile-copy {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 22px;
    }
    .tile h2 {
      font-family: "Cormorant Garamond", serif;
      font-size: 34px;
      margin: 6px 0 8px;
      font-weight: 600;
    }
    .tile p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .count {
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .section-head { margin: 8px 0 22px; }
    .section-head h1, .section-head h2 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(36px, 6vw, 60px);
      margin: 8px 0;
      font-weight: 600;
    }
    .section-head p { color: var(--muted); max-width: 54ch; }
    .back { color: var(--gold); font-size: 13px; }
    .place-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .place-card {
      display: grid;
      grid-template-columns: 168px 1fr;
      gap: 0;
      background: var(--bg-soft);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      min-height: 168px;
      transition: border-color .2s ease, transform .2s ease;
    }
    .place-card:hover { border-color: var(--gold); transform: translateY(-3px); }
    .place-card img { width: 168px; height: 100%; object-fit: cover; }
    .place-card div { padding: 20px 20px 18px; }
    .place-card h3 {
      font-family: "Cormorant Garamond", serif;
      font-size: 28px;
      margin: 0 0 4px;
    }
    .area { color: var(--gold); font-size: 13px; margin-bottom: 8px; }
    .place-card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .cta { display: inline-block; margin-top: 14px; color: var(--ink); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
    .book {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 24px;
      align-items: stretch;
      background: var(--bg-soft);
      border: 1px solid var(--line);
      border-radius: 28px;
      overflow: hidden;
    }
    .book-photo { min-height: 520px; position: relative; }
    .book-photo img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
    .book-form { padding: 36px 32px; }
    label { display: block; font-size: 13px; margin: 0 0 8px; color: var(--muted); }
    input, textarea {
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 13px 14px;
      outline: none;
      margin-bottom: 16px;
    }
    input:focus, textarea:focus { border-color: var(--gold); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn {
      width: 100%;
      border: 0;
      background: linear-gradient(90deg, var(--gold), var(--gold-2));
      color: #2a160c;
      font-weight: 700;
      border-radius: 999px;
      padding: 14px 18px;
      cursor: pointer;
    }
    .error {
      display: none;
      background: rgba(154, 48, 64, .25);
      border: 1px solid rgba(154, 48, 64, .5);
      color: #ffd9de;
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 14px;
      font-size: 14px;
    }
    .ticket {
      width: min(560px, 100%);
      margin: 24px auto 0;
      background: #f6eee4;
      color: #2a160c;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .ticket-top {
      padding: 28px 28px 18px;
      background:
        linear-gradient(180deg, rgba(42,22,12,.08), transparent),
        #f6eee4;
    }
    .ticket-top .kicker { color: var(--wine); }
    .ticket h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: 42px;
      margin: 6px 0 4px;
    }
    .ticket-meta { padding: 0 28px 28px; }
    .ticket-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px dashed rgba(42,22,12,.18);
      font-size: 15px;
    }
    .ticket-row span { color: #7a5a48; }
    .actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
    .ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 12px 18px;
      color: var(--ink);
    }
    .plan-list { display: grid; gap: 12px; }
    .plan-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--bg-soft);
    }
    .empty {
      text-align: center;
      padding: 64px 20px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--bg-soft);
    }
    footer {
      padding: 48px 0 28px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    .latest { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
    .latest a {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      background: var(--bg-soft);
    }
    @media (max-width: 960px) {
      .grid, .place-grid, .book, .latest, .row { grid-template-columns: 1fr; }
      .tile.wide { grid-column: auto; min-height: 280px; }
      .place-card { grid-template-columns: 1fr; }
      .place-card img { width: 100%; height: 180px; }
      .book-photo { min-height: 240px; }
      .hero-copy { padding: 28px 22px; }
    }
  </style>
</head>

      const now = new Date();
      return new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    };
    const formatDay = (iso, long = false) => new Date(iso + 'T12:00:00').toLocaleDateString('en-IN', {
      weekday: long ? 'long' : 'short', day: 'numeric', month: long ? 'long' : 'short', year: 'numeric'
    });
    const formatTime = (hhmm) => {
      const [h, m] = String(hhmm).split(':').map(Number);
      const d = new Date(); d.setHours(h, m);
      return d.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
    };
    const pathParts = () => location.hash.replace(/^#/, '').split('/').filter(Boolean);
    const imgFor = (category, place) => PLACE_MEDIA[place] || MEDIA[category] || MEDIA.hero;

    const renderHome = () => {
      const plans = loadPlans().slice().reverse().slice(0, 3);
      const slugs = Object.keys(catalog.categories);
      const tiles = slugs.map((slug, i) => {
        const category = catalog.categories[slug];
        const wide = i === 0 || i === 3 ? ' wide' : '';
        return `
          <a class="tile${wide}" href="#/plan/${slug}">
            <img src="${MEDIA[slug]}" alt="${escapeHtml(category.name)}">
            <div class="tile-shade"></div>
            <div class="tile-copy">
              <div class="count">${Object.keys(category.places).length} places in Kolkata</div>
              <h2>${escapeHtml(category.name)}</h2>
              <p>${escapeHtml(category.blurb)}</p>
            </div>
          </a>`;
      }).join('');
      const latest = plans.length ? `
        <div class="section-head" style="margin-top:48px">
          <div class="kicker">already chosen</div>
          <h2>Latest plans</h2>
        </div>
        <div class="latest">
          ${plans.map((plan) => `
            <a href="#/dates/${plan.id}">
              <div class="count">${escapeHtml(plan.category_name)}</div>
              <h3 class="serif" style="font-size:28px;margin:8px 0 6px">${escapeHtml(plan.place_name)}</h3>
              <p style="color:var(--muted);margin:0">${formatDay(plan.planned_on)} · ${formatTime(plan.planned_at)}</p>
            </a>`).join('')}
        </div>` : '';
      return `
        <section class="hero">
          <img src="${MEDIA.hero}" alt="Howrah Bridge at night">
          <div class="hero-shade"></div>
          <div class="hero-copy">
            <div class="kicker">Kolkata · just us</div>
            <h1>Choose the night.<br>I’ll be there.</h1>
            <p>${escapeHtml(catalog.tagline)}</p>
            <div class="steps"><span>01 Category</span><span>02 Place</span><span>03 Day & time</span></div>
          </div>
        </section>
        <div class="section-head">
          <div class="kicker">start here</div>
          <h2>What kind of date?</h2>
          <p>Movie, cafe, dinner, a little travel — pick a mood, then a Kolkata place, then the day and time.</p>
        </div>
        <section class="grid">${tiles}</section>
        ${latest}`;
    };

    const renderCategory = (slug) => {
      const category = catalog.categories[slug];
      if (!category) return '<p>That category is not on the list.</p>';
      const places = Object.entries(category.places).map(([placeSlug, place]) => `
        <a class="place-card" href="#/plan/${slug}/${placeSlug}">
          <img src="${imgFor(slug, placeSlug)}" alt="${escapeHtml(place.name)}">
          <div>
            <h3>${escapeHtml(place.name)}</h3>
            <div class="area">${escapeHtml(place.area)}, Kolkata</div>
            <p>${escapeHtml(place.note)}</p>
            <span class="cta">Choose day & time →</span>
          </div>
        </a>`).join('');
      return `
        <p><a class="back" href="#/">← All categories</a></p>
        <div class="section-head">
          <div class="kicker">${escapeHtml(category.emoji)} ${escapeHtml(category.name)}</div>
          <h1>${escapeHtml(category.name)}</h1>
          <p>${escapeHtml(category.blurb)}</p>
        </div>
        <div class="place-grid">${places}</div>`;
    };

    const renderCreate = (categorySlug, placeSlug) => {
      const category = catalog.categories[categorySlug];
      const place = category?.places?.[placeSlug];
      if (!place) return '<p>That place is not on the list.</p>';
      return `
        <p><a class="back" href="#/plan/${categorySlug}">← Other ${escapeHtml(category.name.toLowerCase())}s</a></p>
        <div class="book">
          <div class="book-photo">
            <img src="${imgFor(categorySlug, placeSlug)}" alt="${escapeHtml(place.name)}">
          </div>
          <form class="book-form" id="date-form">
            <div class="kicker">${escapeHtml(category.name)}</div>
            <h1 class="serif" style="font-size:48px;margin:8px 0 6px">${escapeHtml(place.name)}</h1>
            <p class="area">${escapeHtml(place.area)}, Kolkata</p>
            <p style="color:var(--muted);margin:0 0 22px">${escapeHtml(place.note)}</p>
            <div class="error" id="form-error"></div>
            <label>Your name <span style="opacity:.6">(optional)</span></label>
            <input name="planner_name" maxlength="80" placeholder="So I know who locked this in">
            <div class="row">
              <div>
                <label>Day</label>
                <input name="planned_on" type="date" required min="${todayIso()}">
              </div>
              <div>
                <label>Time</label>
                <input name="planned_at" type="time" required value="18:00">
              </div>
            </div>
            <label>A little note <span style="opacity:.6">(optional)</span></label>
            <textarea name="note" rows="4" maxlength="500" placeholder="Wear something cute. I will bring flowers."></textarea>
            <button class="btn" type="submit">Lock in this date</button>
          </form>
        </div>`;
    };

    const renderShow = (id) => {
      const plan = loadPlans().find((item) => item.id === id);
      if (!plan) return '<p>This date is not on the calendar yet.</p>';
      return `
        <div style="text-align:center" class="kicker">it is a date</div>
        <h1 class="serif" style="text-align:center;font-size:clamp(40px,7vw,70px);margin:8px 0 0">See you in Kolkata</h1>
        <article class="ticket">
          <div class="ticket-top">
            <div class="kicker">${escapeHtml(plan.category_name)}</div>
            <h1>${escapeHtml(plan.place_name)}</h1>
            <p style="margin:0;color:#7a5a48">${escapeHtml(plan.place_area)}, Kolkata</p>
          </div>
          <div class="ticket-meta">
            <div class="ticket-row"><span>Day</span><strong>${formatDay(plan.planned_on, true)}</strong></div>
            <div class="ticket-row"><span>Time</span><strong>${formatTime(plan.planned_at)}</strong></div>
            ${plan.planner_name ? `<div class="ticket-row"><span>Chosen by</span><strong>${escapeHtml(plan.planner_name)}</strong></div>` : ''}
            ${plan.note ? `<div class="ticket-row"><span>Note</span><strong>${escapeHtml(plan.note)}</strong></div>` : ''}
          </div>
        </article>
        <div class="actions">
          <a class="btn" style="width:auto;padding:12px 22px" href="#/">Plan another</a>
          <a class="ghost" href="#/our-dates">All our dates</a>
        </div>`;
    };

    const renderIndex = () => {
      const plans = loadPlans().slice().sort((a, b) => (a.planned_on + a.planned_at).localeCompare(b.planned_on + b.planned_at));
      if (!plans.length) {
        return `
          <div class="empty">
            <div class="kicker">calendar</div>
            <h1 class="serif" style="font-size:48px;margin:8px 0">Nothing on the calendar yet</h1>
            <p style="color:var(--muted)">Pick a mood, a Kolkata place, then a day and time.</p>
            <a class="btn" style="width:auto;display:inline-block;margin-top:8px;padding:12px 22px" href="#/">Start with a category</a>
          </div>`;
      }
      return `
        <div class="section-head">
          <div class="kicker">calendar</div>
          <h1>Our plans</h1>
          <p>Every date locked in — the day, the time, and the place in Kolkata.</p>
        </div>
        <div class="plan-list">
          ${plans.map((plan) => `
            <a class="plan-row" href="#/dates/${plan.id}">
              <div>
                <div class="count">${escapeHtml(plan.category_name)}</div>
                <h3 class="serif" style="font-size:30px;margin:4px 0">${escapeHtml(plan.place_name)}</h3>
                <div class="area">${escapeHtml(plan.place_area)}, Kolkata</div>
              </div>
              <div style="text-align:right;color:var(--muted)">
                <div>${formatDay(plan.planned_on)}</div>
                <div>${formatTime(plan.planned_at)}</div>
              </div>
            </a>`).join('')}
        </div>`;
    };

    const bindCreate = (categorySlug, placeSlug) => {
      const form = $('#date-form');
      if (!form) return;
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const category = catalog.categories[categorySlug];
        const place = category.places[placeSlug];
        const data = new FormData(form);
        const plannedOn = data.get('planned_on');
        const error = $('#form-error');
        if (!plannedOn || plannedOn < todayIso()) {
          error.style.display = 'block';
          error.textContent = 'Pick today or a day still ahead.';
          return;
        }
        const plan = {
          id: crypto.randomUUID(),
          planner_name: String(data.get('planner_name') || '').trim(),
          category_slug: categorySlug,
          category_name: category.name,
          place_slug: placeSlug,
          place_name: place.name,
          place_area: place.area,
          planned_on: plannedOn,
          planned_at: String(data.get('planned_at') || '').slice(0, 5),
          note: String(data.get('note') || '').trim()
        };
        savePlans([...loadPlans(), plan]);
        location.hash = `#/dates/${plan.id}`;
      });
    };

    const render = () => {
      const parts = pathParts();
      let html = renderHome();
      if (parts[0] === 'our-dates') html = renderIndex();
      else if (parts[0] === 'dates' && parts[1]) html = renderShow(parts[1]);
      else if (parts[0] === 'plan' && parts[1] && parts[2]) html = renderCreate(parts[1], parts[2]);
      else if (parts[0] === 'plan' && parts[1]) html = renderCategory(parts[1]);
      $('#app').innerHTML = html;
      if (parts[0] === 'plan' && parts[1] && parts[2]) bindCreate(parts[1], parts[2]);
      window.scrollTo({ top: 0, behavior: 'instant' });
    };

    const boot = (data) => {
      catalog = data;
      if (!location.hash) location.hash = '#/';
      render();
      window.addEventListener('hashchange', render);
    };
    if (window.DATE_CATALOG) boot(window.DATE_CATALOG);
  </script>
</body>
</html>
